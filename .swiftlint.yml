included:
  - Sources
  - Tests
  - Example

disabled_rules:
  - todo
  - trailing_comma
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - first_where
  - sorted_first_last
  - vertical_whitespace_closing_braces

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 500
  error: 700

file_length:
  warning: 600
  error: 900

identifier_name:
  min_length: 2
  excluded:
    - id

nesting:
  type_level: 2

force_cast: warning
force_try: warning
